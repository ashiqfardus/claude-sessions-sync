name: Feature request
description: Suggest something the tool should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve
      description: Describe the situation, not the solution you have in mind.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you would like it to do
  - type: checkboxes
    id: checked
    attributes:
      label: Before filing
      options:
        - label: I have read DESIGN.md and this is not already listed as planned
