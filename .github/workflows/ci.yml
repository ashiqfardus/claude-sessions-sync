name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # The author develops on Windows only, so the macOS and Linux jobs are the only
    # thing standing between "it compiles" and a claim of cross-platform support.
    # Do not mark this workflow optional.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true

      - name: gofmt
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: test
        run: go test -race ./...

      - name: smoke test
        shell: bash
        run: |
          set -euo pipefail
          go build -o cs ./cmd/claude-sessions

          # Never pipe this binary into `grep -q`. grep exits at its first match and
          # closes the pipe; on Unix the resulting EPIPE on stdout becomes SIGPIPE and
          # kills the writer with 141, which pipefail then reports as a failure. It
          # looks like a flake and is not one - it depends only on whether the match
          # is in the final write. Capture the output, then match against the string.
          run() {
            local expect_fail="$1"; shift
            local out code
            set +e
            out=$("$@" 2>&1)
            code=$?
            set -e
            echo "$out"
            if [ "$expect_fail" = "fail" ] && [ $code -eq 0 ]; then
              echo "FAIL: expected '$*' to exit non-zero"; exit 1
            fi
            if [ "$expect_fail" = "ok" ] && [ $code -ne 0 ]; then
              echo "FAIL: expected '$*' to exit zero, got $code"; exit 1
            fi
            SMOKE_OUT="$out"
          }

          expect() {
            case "$SMOKE_OUT" in
              *"$1"*) ;;
              *) echo "FAIL: expected output to contain: $1"; exit 1 ;;
            esac
          }

          run ok ./cs version
          expect "claude-sessions"

          # A fresh machine is a normal starting state: doctor must produce a readable
          # report and exit non-zero, rather than crashing or falsely passing.
          empty="$RUNNER_TEMP/empty-profile"
          mkdir -p "$empty/projects"
          run fail ./cs doctor --claude-dir "$empty" --archive "$RUNNER_TEMP/not-mounted"
          expect "not reachable"
          expect "claude root"

          # And it must pass once the archive is real and writable - warnings about a
          # missing hook are expected here, but nothing may FAIL.
          good="$RUNNER_TEMP/good-archive"
          mkdir -p "$good"
          run ok ./cs doctor --claude-dir "$empty" --archive "$good"
          expect "archive"
          expect "0 failure(s)"

          run ok ./cs ls --claude-dir "$empty"
          expect "No sessions found"

          run ok ./cs stats --claude-dir "$empty"
          expect "No sessions found"

          run ok ./cs completion bash
          expect "complete -F"

          run fail ./cs completion

  minimum-go:
    # go.mod declares the oldest supported toolchain. Verify it is honest, so users on
    # a distro Go are not told to upgrade for no reason.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - run: go build ./... && go vet ./... && go test ./...

  build:
    name: cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: build all release targets
        run: |
          set -e
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} go build -o /dev/null ./...
            echo "ok  $target"
          done
