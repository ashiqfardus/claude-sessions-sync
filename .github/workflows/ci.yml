name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # The author develops on Windows only, so the macOS and Linux jobs are the only
    # thing standing between "it compiles" and a claim of cross-platform support.
    # Do not mark this workflow optional.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          check-latest: true

      - name: gofmt
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: test
        run: go test -race ./...

      - name: smoke test
        shell: bash
        run: |
          go build -o cs ./cmd/claude-sessions
          ./cs version
          # Must degrade gracefully against a profile that does not exist rather than
          # crashing: a fresh machine is a normal starting state.
          ./cs doctor --claude-dir "$RUNNER_TEMP/nope" --archive "$RUNNER_TEMP/nope" || true

  build:
    name: cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - name: build all targets
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} go build -o /dev/null ./... \
              && echo "ok  $target" || { echo "FAIL $target"; exit 1; }
          done
