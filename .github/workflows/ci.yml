name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # The author develops on Windows only, so the macOS and Linux jobs are the only
    # thing standing between "it compiles" and a claim of cross-platform support.
    # Do not mark this workflow optional.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true

      - name: gofmt
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: test
        run: go test -race ./...

      - name: smoke test
        shell: bash
        run: |
          set -euo pipefail
          go build -o cs ./cmd/claude-sessions

          # Never pipe this binary into `grep -q`. grep exits at its first match and
          # closes the pipe; on Unix the resulting EPIPE on stdout becomes SIGPIPE and
          # kills the writer with 141, which pipefail then reports as a failure. It
          # looks like a flake and is not one - it depends only on whether the match
          # is in the final write. Capture the output, then match against the string.
          run() {
            local expect_fail="$1"; shift
            local out code
            set +e
            out=$("$@" 2>&1)
            code=$?
            set -e
            echo "$out"
            if [ "$expect_fail" = "fail" ] && [ $code -eq 0 ]; then
              echo "FAIL: expected '$*' to exit non-zero"; exit 1
            fi
            if [ "$expect_fail" = "ok" ] && [ $code -ne 0 ]; then
              echo "FAIL: expected '$*' to exit zero, got $code"; exit 1
            fi
            SMOKE_OUT="$out"
          }

          expect() {
            case "$SMOKE_OUT" in
              *"$1"*) ;;
              *) echo "FAIL: expected output to contain: $1"; exit 1 ;;
            esac
          }

          run ok ./cs version
          expect "claude-sessions"

          # A fresh machine is a normal starting state: doctor must produce a readable
          # report and exit non-zero, rather than crashing or falsely passing.
          empty="$RUNNER_TEMP/empty-profile"
          mkdir -p "$empty/projects"
          run fail ./cs doctor --claude-dir "$empty" --archive "$RUNNER_TEMP/not-mounted"
          expect "not reachable"
          expect "claude root"

          # And it must pass once the archive is real and writable - warnings about a
          # missing hook are expected here, but nothing may FAIL.
          good="$RUNNER_TEMP/good-archive"
          mkdir -p "$good"
          run ok ./cs doctor --claude-dir "$empty" --archive "$good"
          expect "archive"
          expect "0 failure(s)"

          run ok ./cs ls --claude-dir "$empty"
          expect "No sessions found"

          run ok ./cs stats --claude-dir "$empty"
          expect "No sessions found"

          run ok ./cs completion bash
          expect "complete -F"

          run fail ./cs completion

  minimum-go:
    # go.mod declares the oldest supported toolchain. Verify it is honest, so users on
    # a distro Go are not told to upgrade for no reason.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - run: go build ./... && go vet ./... && go test ./...

  build:
    name: cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: build all release targets
        run: |
          set -e
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} go build -o /dev/null ./...
            echo "ok  $target"
          done

      # go build ignores _test.go files, so a test that references something declared
      # only in a //go:build windows file compiles fine here and breaks the macOS and
      # Linux jobs instead. vet type-checks tests, so run it per platform.
      - name: vet tests for every platform
        run: |
          set -e
          for os in linux darwin windows; do
            GOOS=$os GOARCH=amd64 go vet ./...
            echo "ok  vet $os"
          done

  install-e2e:
    name: install on ${{ matrix.os }}
    # Actually registers the hook and the sweep on each OS, rather than trusting that
    # code which only compiles there also works there. The scheduler may legitimately
    # fail on a CI runner - a macOS runner has no GUI session for launchd, an Ubuntu
    # runner no user D-Bus for systemd - so the sweep is allowed to degrade, and the
    # hook, which is what archives every normal session, is not.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: install, use, uninstall
        shell: bash
        run: |
          set -euo pipefail
          go build -o cs ./cmd/claude-sessions

          profile="$RUNNER_TEMP/claude"
          archive="$RUNNER_TEMP/archive"
          mkdir -p "$profile/projects/e--work-api" "$archive"

          # A settings.json with someone else's hook and unrelated keys, all of which
          # must survive install and uninstall untouched.
          cat > "$profile/settings.json" <<'JSON'
          {
            "model": "opus",
            "cleanupPeriodDays": 3650,
            "hooks": {
              "PostToolUse": [
                {"matcher": "Edit", "hooks": [{"type": "command", "command": "prettier"}]}
              ]
            }
          }
          JSON

          printf '%s\n' \
            '{"type":"user","cwd":"/work/api","sessionId":"ci-1","timestamp":"2026-08-30T09:00:00.000Z","message":{"role":"user","content":"why is the build failing"}}' \
            '{"type":"assistant","timestamp":"2026-08-30T09:00:03.000Z","message":{"role":"assistant","content":[{"type":"text","text":"looking"},{"type":"tool_use","name":"Bash","input":{"command":"make test"}}]}}' \
            > "$profile/projects/e--work-api/ci-1.jsonl"

          echo "::group::install"
          ./cs install --claude-dir "$profile" --archive "$archive" | tee install.log
          echo "::endgroup::"

          grep -q "hook      SessionEnd" install.log || { echo "FAIL: no hook reported"; exit 1; }

          # The sweep is best-effort on a runner; say which happened, do not fail on it.
          if grep -q "sweep     FAILED" install.log; then
            echo "NOTE: scheduler unavailable on this runner - hook-only install"
          fi

          # The hook must be a real, runnable binary at the path that was installed.
          hook_bin="$profile/bin/claude-sessions"
          [ "$RUNNER_OS" = "Windows" ] && hook_bin="$profile/bin/claude-sessions.exe"
          [ -x "$hook_bin" ] || { echo "FAIL: installed binary missing at $hook_bin"; exit 1; }

          echo "::group::run the hook exactly as Claude Code would"
          "$hook_bin" push --quiet --claude-dir "$profile" --archive "$archive"
          echo "exit=$?"
          echo "::endgroup::"

          [ -f "$archive/projects/e--work-api/ci-1.jsonl" ] || { echo "FAIL: session not archived"; exit 1; }
          [ -f "$archive/html/index.html" ] || { echo "FAIL: pages not rendered"; exit 1; }
          grep -q "why is the build failing" "$archive/html/e--work-api/ci-1.html" \
            || { echo "FAIL: rendered page missing the conversation"; exit 1; }

          echo "::group::doctor"
          ./cs doctor --claude-dir "$profile" --archive "$archive" | tee doctor.log || true
          echo "::endgroup::"
          grep -q "session hook" doctor.log || { echo "FAIL: doctor does not see the hook"; exit 1; }

          # The hook must never break the end of a session, whatever the state of the
          # archive. This is the single most important behaviour in the tool.
          "$hook_bin" push --quiet --claude-dir "$profile" --archive "$RUNNER_TEMP/not-mounted"
          echo "unreachable archive, quiet mode: exit=$? (must be 0)"

          echo "::group::uninstall"
          ./cs uninstall --claude-dir "$profile" | tee uninstall.log
          echo "::endgroup::"

          # Everything that was not ours must have survived both operations.
          python3 - "$profile/settings.json" <<'PY'
          import json, sys
          s = json.load(open(sys.argv[1]))
          assert s.get("model") == "opus", "unrelated setting lost"
          assert s.get("cleanupPeriodDays") == 3650, "unrelated setting lost"
          post = s.get("hooks", {}).get("PostToolUse")
          assert post, "another tool's hook was removed"
          assert "SessionEnd" not in s.get("hooks", {}), "our hook was not removed"
          print("settings.json intact and our hook gone")
          PY
